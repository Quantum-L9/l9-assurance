name: assurance-validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'rewrite/**'
      - 'migration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assurance-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python assurance plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: --disable-pip-version-check "uv==0.12.10"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          # uv.lock is this repository's resolved dependency set. Exporting it
          # yields a fully pinned, per-artifact-hashed requirements file, so pip
          # runs in hash-checking mode: the job installs the exact artifacts the
          # lockfile records and nothing else. `pip install -e .[dev]`
          # re-resolved on every run instead, so CI tested whatever PyPI served
          # that morning rather than what the lockfile pins. `--locked` also
          # fails the job when the lockfile has drifted from pyproject.toml.
          #
          # `--only-binary :all:` refuses source distributions, so no
          # dependency's setup.py executes during installation.
          #
          # Only dependencies are installed, not the project: scripts/ci.py puts
          # src/ on PYTHONPATH itself. Skipping the editable install is what
          # allows every install here to be both locked and wheel-only, and it
          # leaves the runner's own pip intact -- scripts/ci.py::_exercise_wheel
          # shells out to `python -m pip wheel . --no-build-isolation` to prove
          # the package really builds and installs from a wheel.
          uv export --locked --extra dev --no-emit-project --format requirements-txt \
            > "${RUNNER_TEMP}/locked-requirements.txt"
          python -m pip install --only-binary :all: -r "${RUNNER_TEMP}/locked-requirements.txt"
          # --no-build-isolation means the build backend is not fetched on
          # demand, so it has to be present already.
          python -m pip install --only-binary :all: "setuptools==84.0.0" "wheel==0.48.0"

      - name: Run repository gates
        run: |
          set -euo pipefail
          python scripts/ci.py
