# L9 Consumer Lint + Test — Python Preset (LOCKED STRUCTURE)
#
# DO NOT EDIT workflow structure — only the env: block is consumer-configurable.
# Managed by l9-ci-core presets/python.
#
# Conventions:
#   - Immutable event-revision checkout (no floating action ref)
#   - SHA-pinned external actions
#   - Least privilege (contents: read only)
name: L9 Lint and Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# ── CONFIGURABLE: agent sets these during activation ───────────────────────────
env:
  PYTHON_VERSION: "3.12"
  SOURCE_DIR: "src/"
  TEST_DIR: "tests/"
  COVERAGE_THRESHOLD: "0"

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Every install below is version-pinned and wheel-only. `--only-binary
      # :all:` refuses source distributions, so no dependency's setup.py runs
      # during installation; the pins make the toolchain reproducible instead of
      # "whatever PyPI served that morning", which is what an unpinned
      # `pip install ruff` resolved to.
      - name: Install lint tools
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: "ruff==0.16.1" "mypy==2.3.0"

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: |
          mypy "${SOURCE_DIR}" \
            --show-error-codes --pretty \
            --install-types --non-interactive --ignore-missing-imports

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv.lock already pins the project's dev extra (pytest, pytest-cov,
      # pytest-xdist, pytest-timeout), so the chain of unpinned conditional
      # `pip install` fallbacks this replaced was both unreproducible and
      # unnecessary. `--locked` installs exactly what uv.lock records and fails
      # the job when it has drifted from pyproject.toml; `--no-build` refuses
      # source distributions, so no dependency's setup.py runs.
      - name: Install test tools
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: "uv==0.12.10"
          uv sync --locked --no-build --extra dev

      - name: pytest with coverage
        env:
          TESTING: "true"
        run: |
          set -euo pipefail
          # --no-sync: the environment was built by the step above, and letting
          # uv re-resolve here would undo that step's --no-build guarantee.
          PYTHONPATH=. uv run --no-sync pytest "${TEST_DIR}" \
            -n auto \
            --cov="${SOURCE_DIR}" \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_THRESHOLD}" \
            --timeout=300 --tb=short -v
