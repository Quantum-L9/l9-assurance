# L9 Governed Analysis Pipeline — Python Preset (LOCKED)
#
# DO NOT EDIT — this file is managed by l9-ci-core presets/python.
# To update, pull the latest preset from Quantum-L9/l9-ci-core.
#
# This workflow runs the full L9 analysis pipeline:
#   1. Resolve governance config from .github/governance/
#   2. Run semgrep with Python rulesets
#   3. Provision the SDK (immutable, pinned)
#   4. Normalize → Validate → Project → Route → Manifest → Upload
#   5. Publish results as GitHub Checks
name: L9 Analysis
on:
  pull_request:
  workflow_dispatch:

env:
  L9_CORE_REF: "0894c11c69ea6cd1890c09fc905b76ff6dca206e"
  L9_PROFILE: "pr_fast"
  L9_MATRIX_ID: "pr-semgrep"

# Workflow-level default is read-only. `checks: write` is declared by the two
# jobs that publish check runs, so granting it here as well widened every job's
# token for no benefit.
permissions:
  contents: read

concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Governed Semgrep Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.gov.outputs.enabled }}
      mode: ${{ steps.gov.outputs.mode }}
      governance-digest: ${{ steps.gov.outputs.governance-digest }}
      artifact-name: ${{ steps.names.outputs.artifact-name }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - id: gov
        name: Resolve governance
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@0894c11c69ea6cd1890c09fc905b76ff6dca206e
        with:
          profile: ${{ env.L9_PROFILE }}
          provider: semgrep
          event-name: ${{ github.event_name }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - id: names
        name: Compute artifact names
        env:
          MATRIX_ID: ${{ env.L9_MATRIX_ID }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - id: semgrep
        name: Run semgrep
        if: steps.gov.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # Pinned and wheel-only: the scanner version is part of what makes a
          # scan result reproducible, and --only-binary :all: keeps any
          # dependency's setup.py from executing during installation.
          pip install --only-binary :all: "semgrep==1.176.1"
          echo "version=$(semgrep --version)" >> "$GITHUB_OUTPUT"
          mkdir -p "artifacts/raw/semgrep/${L9_MATRIX_ID}"
          semgrep scan \
            --config p/python \
            --json \
            --output "artifacts/raw/semgrep/${L9_MATRIX_ID}/report.json" \
            --error --quiet || true
        env:
          L9_MATRIX_ID: ${{ env.L9_MATRIX_ID }}

      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@0894c11c69ea6cd1890c09fc905b76ff6dca206e

      - name: Normalize provider report
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@0894c11c69ea6cd1890c09fc905b76ff6dca206e
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-normalize
          input: artifacts/raw/semgrep/${{ env.L9_MATRIX_ID }}/report.json
          output: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json
          root: .
          snapshot-id: ${{ github.sha }}
          revision: ${{ github.sha }}
          provider-version: ${{ steps.semgrep.outputs.version }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs.required-provider }}
          policy: ${{ steps.gov.outputs.sdk-policy }}

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@0894c11c69ea6cd1890c09fc905b76ff6dca206e
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json

      - id: gate
        name: Evaluate gate (SDK verdict)
        if: steps.gov.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # The SDK is the single gate-decision authority. Its canonical
          # gate-result artifact is staged with the rest of the evidence so the
          # index can resolve it; enforcement belongs to the publish job.
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *)
              echo "gate evaluate failed with unexpected exit ${exit_code}" >&2
              exit "${exit_code}"
              ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK gate verdict: ${status} (exit ${exit_code})"
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@0894c11c69ea6cd1890c09fc905b76ff6dca206e
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json
          output: .l9/runtime/${{ env.L9_MATRIX_ID }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@0894c11c69ea6cd1890c09fc905b76ff6dca206e
        with:
          provider: semgrep
          matrix-id: ${{ env.L9_MATRIX_ID }}
          raw-report: artifacts/raw/semgrep/${{ env.L9_MATRIX_ID }}/report.json
          bundle: .l9/runtime/${{ env.L9_MATRIX_ID }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ env.L9_MATRIX_ID }}/agent-review-payload.json
          destination-root: artifacts

      - name: Stage gate result with canonical artifacts
        if: steps.gov.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" \
            "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true'
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@0894c11c69ea6cd1890c09fc905b76ff6dca206e
        with:
          provider: semgrep
          matrix-id: ${{ env.L9_MATRIX_ID }}
          artifact-name: ${{ steps.names.outputs.artifact-name }}
          repository: ${{ github.repository }}
          repository-revision: ${{ github.sha }}
          sdk-revision: ${{ steps.sdk.outputs.sdk-revision }}
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs.agent-payload }}
          artifact-root: artifacts
          raw-directory: ${{ steps.route.outputs.raw-directory }}
          routing-record: ${{ steps.route.outputs.routing-record }}
          output: artifacts/metadata/${{ env.L9_MATRIX_ID }}/artifact-index.json

      - name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: |
            artifacts/raw/semgrep/${{ env.L9_MATRIX_ID }}/
            artifacts/l9/${{ env.L9_MATRIX_ID }}/
            artifacts/metadata/${{ env.L9_MATRIX_ID }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish analysis (Core)
    needs: analyze
    if: needs.analyze.outputs.enabled == 'true'
    uses: Quantum-L9/l9-ci-core/.github/workflows/publish-analysis.yml@0894c11c69ea6cd1890c09fc905b76ff6dca206e
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      artifact-name: ${{ needs.analyze.outputs.artifact-name }}
      profile: pr_fast
      mode: ${{ needs.analyze.outputs.mode }}
      provider: semgrep
      matrix-id: pr-semgrep
      governance-digest: ${{ needs.analyze.outputs.governance-digest }}
      repository-revision: ${{ github.sha }}
      workflow-result: ${{ needs.analyze.result }}
