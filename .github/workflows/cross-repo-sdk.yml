# Executed SDK -> assurance seam proof.
#
# The assurance validation job only proves assurance against its own fixtures.
# That is exactly how the `sdkVersion` contract drift reached main unnoticed:
# the SDK validated its output against the SDK's schema, and no assurance
# fixture ever carried the field. This job installs the real producer next to
# the real consumer and admits real SDK output, so the seam cannot silently
# break again.
#
# Conventions:
#   - SHA-pinned external actions
#   - Least privilege (contents: read only)
name: cross-repo-sdk-seam

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Daily, so SDK-side drift surfaces here rather than in a release.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      sdk-ref:
        description: 'l9-ci-sdk ref to prove this assurance revision against'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: cross-repo-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seam:
    name: Admit real SDK observations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out assurance
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Check out l9-ci-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Quantum-L9/l9-ci-sdk
          ref: ${{ github.event.inputs.sdk-ref || 'main' }}
          path: .l9-ci-sdk
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      # The one third-party install this job makes is pinned to the version
      # uv.lock already resolves, so the seam is proven against a fixed test
      # runner rather than whatever pip picks on the day. Everything else is a
      # path install from the two checkouts above -- which is the point of the
      # job: it proves *these* two revisions against each other, and the SDK's
      # revision is chosen by the checkout step, not by a resolver.
      - name: Install both sides of the seam
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1'
          python -m pip install --disable-pip-version-check ./ ./.l9-ci-sdk

      - name: Report the proven revisions
        run: |
          python - <<'PY'
          import l9_assurance, l9_ci
          print(f"l9-ci-sdk producer version: {l9_ci.__version__}")
          print(f"l9-assurance consumer package: {l9_assurance.__file__}")
          PY

      # L9_CROSS_REPO_SDK_REQUIRED=1 turns "the SDK is not importable" from a
      # skip into a hard failure, so this job cannot pass vacuously.
      - name: Prove the SDK -> assurance admission seam
        env:
          L9_CROSS_REPO_SDK_REQUIRED: '1'
        run: python -m pytest -q tests/cross_repo
